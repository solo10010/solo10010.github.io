<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qyran — платформа наступательной безопасности: конвейер разведки, прокси и AI-агенты">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#070d1c"/><stop offset="1" stop-color="#0b1730"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.4"><stop stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#13213d"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/><rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Звезда-логотип (беркут) -->
  <g transform="translate(320 315)">
    <path d="M0 -150 C 18 -40, 40 -18, 150 0 C 40 18, 18 40, 0 150 C -18 40, -40 18, -150 0 C -40 -18, -18 -40, 0 -150 Z" fill="url(#brand)"/>
    <circle r="22" fill="#070d1c"/>
    <circle r="190" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 10"/>
    <circle r="240" stroke="#06b6d4" stroke-opacity="0.18" stroke-width="2"/>
    <g fill="#38bdf8"><circle cx="190" cy="0" r="6"/><circle cx="-134" cy="-134" r="6"/><circle cx="-40" cy="186" r="6"/></g>
    <circle cx="170" cy="-170" r="7" fill="#f59e0b"/>
  </g>

  <!-- Текст -->
  <g font-family="'Inter','Segoe UI',Arial,sans-serif">
    <text x="640" y="250" font-size="110" font-weight="800" letter-spacing="2" fill="url(#brand)">QYRAN</text>
    <text x="644" y="300" font-size="28" font-weight="600" fill="#e2e8f0">Платформа для bug bounty и аудита</text>
  </g>
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="20" fill="#94a3b8">
    <text x="644" y="360"><tspan fill="#38bdf8">●</tspan> сигнальный конвейер разведки</text>
    <text x="644" y="395"><tspan fill="#38bdf8">●</tspan> свой прокси · HTTPQL · Match &amp; Replace</text>
    <text x="644" y="430"><tspan fill="#38bdf8">●</tspan> nuclei · ZAP · OpenVAS · JS-анализ</text>
    <text x="644" y="465"><tspan fill="#a78bfa">●</tspan> 32 AI-агента · 120+ навыков</text>
  </g>
  <text x="644" y="560" font-family="'JetBrains Mono',Consolas,monospace" font-size="18" fill="#475569">Қыран — беркут</text>
</svg>
