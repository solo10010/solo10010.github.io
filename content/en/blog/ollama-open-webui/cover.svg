    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop stop-color="#14d3b4" stop-opacity="0.35"/><stop offset="1" stop-color="#14d3b4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#13243a"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <circle cx="320" cy="330" r="260" fill="url(#glow)"/>
  
  <g transform="translate(190 170)">
