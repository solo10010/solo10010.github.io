      <rect x="24" y="28" width="212" height="58" rx="10"/><rect x="24" y="104" width="212" height="58" rx="10"/><rect x="24" y="180" width="212" height="58" rx="10"/>
    </g>
    <g fill="#14d3b4"><circle cx="54" cy="57" r="7"/><circle cx="54" cy="133" r="7"/><circle cx="54" cy="209" r="7" fill="#f59e0b"/></g>
    <g stroke="#3b5878" stroke-width="4" stroke-linecap="round"><path d="M86 57H200M86 133H180M86 209H206"/></g>
    <text x="130" y="290" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="20" fill="#14d3b4">127.0.0.1</text>
  </g>
  
  <g stroke="#14d3b4" stroke-opacity="0.5" stroke-width="2">
    <path d="M470 250L560 200M470 250L560 300M470 330L560 300M470 330L560 400M470 410L560 400M470 410L560 300M560 200L650 260M560 300L650 260M560 300L650 360M560 400L650 360"/>
  </g>
  <g fill="#14d3b4"><circle cx="470" cy="250" r="9"/><circle cx="470" cy="330" r="9"/><circle cx="470" cy="410" r="9"/><circle cx="560" cy="200" r="9"/><circle cx="560" cy="300" r="9"/><circle cx="560" cy="400" r="9"/><circle cx="650" cy="260" r="10" fill="#e2e8f0"/><circle cx="650" cy="360" r="10" fill="#e2e8f0"/></g>
  
