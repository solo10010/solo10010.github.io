    <rect x="760" y="296" width="360" height="110" rx="16" fill="#0d2a33" stroke="#14d3b4" stroke-width="2"/>
    <text x="785" y="338" font-size="21" fill="#99f6e4">Top IPs by 404 and suspicious</text>
    <text x="785" y="370" font-size="21" fill="#99f6e4">paths — no data sent to the cloud</text>
