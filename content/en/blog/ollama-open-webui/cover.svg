  <text x="1130" y="96" text-anchor="end" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="50" font-weight="800" fill="#e2e8f0">Ollama <tspan fill="#14d3b4">+</tspan> Open WebUI</text>
  <text x="720" y="530" font-family="'JetBrains Mono',Consolas,monospace" font-size="20" fill="#64748b">local LLM · no cloud · no leaks</text>
</svg>
