<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReconWTF: радар разведки поддоменов">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#07101f"/><stop offset="1" stop-color="#0a1f1a"/></linearGradient>
    <radialGradient id="radar" cx="0.5" cy="0.5" r="0.5"><stop stop-color="#14d3b4" stop-opacity="0.18"/><stop offset="1" stop-color="#14d3b4" stop-opacity="0.02"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#14d3b4" stop-opacity="0"/><stop offset="1" stop-color="#14d3b4" stop-opacity="0.55"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#13302b"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <!-- Радар -->
  <g transform="translate(330 330)">
    <circle r="230" fill="url(#radar)" stroke="#14d3b4" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="160" stroke="#14d3b4" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="90" stroke="#14d3b4" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M-230 0 H 230 M0 -230 V 230" stroke="#14d3b4" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M0 0 L 230 0 A230 230 0 0 0 163 -163 Z" fill="url(#sweep)"/>
    <g fill="#14d3b4"><circle cx="120" cy="-70" r="7"/><circle cx="-80" cy="-140" r="6"/><circle cx="-150" cy="60" r="6"/><circle cx="60" cy="130" r="6"/></g>
    <circle cx="170" cy="-40" r="9" fill="#f59e0b"/>
    <circle r="8" fill="#e2e8f0"/>
  </g>
  <!-- Список найденного -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="22">
    <text x="660" y="200" fill="#94a3b8">$ ./reconwtf.sh -d target.com -a</text>
    <text x="660" y="250" fill="#14d3b4">[+] <tspan fill="#cbd5e1">api.target.com</tspan></text>
    <text x="660" y="290" fill="#14d3b4">[+] <tspan fill="#cbd5e1">dev.target.com</tspan></text>
    <text x="660" y="330" fill="#14d3b4">[+] <tspan fill="#cbd5e1">old-admin.target.com</tspan></text>
    <text x="660" y="370" fill="#f59e0b">[!] <tspan fill="#fde68a">secret in app.js</tspan></text>
    <text x="660" y="410" fill="#14d3b4">[+] <tspan fill="#cbd5e1">443, 8080, 9200</tspan></text>
    <text x="660" y="450" fill="#64748b">... nuclei: 3 findings</text>
  </g>
  <text x="1130" y="80" text-anchor="end" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="48" font-weight="800" fill="#e2e8f0">recon<tspan fill="#14d3b4">WTF</tspan></text>
  <text x="660" y="560" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#64748b">subdomains · endpoints · js · ports · vulns</text>
</svg>
