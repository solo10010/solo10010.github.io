<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Расследование взлома сайта: терминал, лупа и найденный веб-шелл">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#07101f"/><stop offset="1" stop-color="#121a2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14d3b4"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.55" r="0.42"><stop stop-color="#f43f5e" stop-opacity="0.18"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#1c2a47"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/><rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Терминал -->
  <rect x="80" y="140" width="560" height="380" rx="16" fill="#0b1324" stroke="#2a3b60" stroke-width="2"/>
  <rect x="80" y="140" width="560" height="44" rx="16" fill="#141f38"/>
  <g fill="#3b4d73"><circle cx="110" cy="162" r="7"/><circle cx="134" cy="162" r="7"/><circle cx="158" cy="162" r="7"/></g>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="20">
    <text x="105" y="225" fill="#14d3b4">$ <tspan fill="#cbd5e1">ss -antp | grep ESTAB</tspan></text>
    <text x="105" y="260" fill="#14d3b4">$ <tspan fill="#cbd5e1">find /var/www -mtime -14</tspan></text>
    <text x="105" y="295" fill="#64748b">./upload/img/logo.png</text>
    <text x="105" y="330" fill="#f43f5e">./upload/img/cache.php   ← !</text>
    <text x="105" y="365" fill="#64748b">./index.php</text>
    <text x="105" y="400" fill="#14d3b4">$ <tspan fill="#cbd5e1">grep -RIn "eval(base64" .</tspan></text>
    <text x="105" y="435" fill="#f43f5e">cache.php:1: eval(base64_decode(...</text>
    <text x="105" y="480" fill="#14d3b4">$ <tspan fill="#cbd5e1">_</tspan></text>
  </g>
  <!-- Лупа -->
  <g transform="translate(860 310)">
    <circle r="120" fill="#0d2a33" fill-opacity="0.6" stroke="url(#accent)" stroke-width="12"/>
    <path d="M85 85 L170 170" stroke="url(#accent)" stroke-width="26" stroke-linecap="round"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="26" text-anchor="middle">
      <text y="-10" fill="#f43f5e">&lt;?php</text>
      <text y="28" fill="#fda4af">eval(...)</text>
    </g>
  </g>
  <text x="1130" y="80" text-anchor="end" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="44" font-weight="800" fill="#e2e8f0">Расследование <tspan fill="url(#accent)">взлома</tspan></text>
  <text x="80" y="585" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" fill="#94a3b8">1. сохранить → 2. проанализировать → 3. устранить</text>
</svg>
