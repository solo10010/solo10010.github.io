<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Corporate email compromise: a message silently forwarded to an attacker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d0a18"/>
      <stop offset="1" stop-color="#1a0f24"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.55" r="0.45">
      <stop stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#241a35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  
  <g transform="translate(150 190)">
    <rect width="340" height="230" rx="18" fill="#1a1530" stroke="url(#danger)" stroke-width="5"/>
    <path d="M10 14 L170 130 L330 14" stroke="url(#danger)" stroke-width="5" stroke-linejoin="round"/>
    <g fill="#2e2648">
      <rect x="40" y="160" width="160" height="12" rx="6"/>
      <rect x="40" y="185" width="110" height="12" rx="6"/>
    </g>
  </g>

  
  <g stroke="url(#danger)" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round">
    <path d="M500 305 C 600 305, 640 230, 740 230"/>
    <path d="M500 305 C 600 305, 640 380, 740 380"/>
  </g>
  <path d="M728 218 l14 12 -14 12" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M728 368 l14 12 -14 12" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  
  <g transform="translate(870 300)">
    <circle r="130" fill="#1a1530" stroke="#3a2d55" stroke-width="3"/>
    <path d="M-80 95 C -80 10, -50 -70, 0 -70 C 50 -70, 80 10, 80 95 Z" fill="#0d0a18" stroke="url(#danger)" stroke-width="4"/>
    <ellipse cx="0" cy="-5" rx="38" ry="46" fill="#07050d"/>
    <circle cx="-14" cy="-8" r="5" fill="#f43f5e"/>
    <circle cx="14" cy="-8" r="5" fill="#f43f5e"/>
  </g>

  
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="22" fill="#a1a1b5">
    <text x="560" y="210">IMAP</text>
    <text x="560" y="420">sieve: redirect</text>
  </g>

  <text x="1130" y="80" text-anchor="end" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#f1f5f9">Mail takeover <tspan fill="url(#danger)">· BEC</tspan></text>
  <text x="80" y="570" font-family="'JetBrains Mono', Consolas, monospace" font-size="24" fill="#a1a1b5">$ grep "login" mail.log <tspan fill="#f43f5e">● unusual geo</tspan></text>
</svg>
