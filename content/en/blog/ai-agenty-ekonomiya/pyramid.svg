<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Пирамида затрат на AI-агентов">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1120"/><stop offset="1" stop-color="#121a2e"/></linearGradient></defs>
  <rect width="1200" height="520" rx="18" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#e2e8f0">Кто делает работу — и сколько это стоит</text>
  <g font-family="'Inter','Segoe UI',Arial,sans-serif" text-anchor="middle">
    <path d="M600 80 L700 160 H500 Z" fill="#3b1b2a" stroke="#f43f5e" stroke-width="2"/>
    <text x="600" y="145" font-size="17" font-weight="700" fill="#fda4af">Человек</text>
    <path d="M500 168 H700 L800 248 H400 Z" fill="#2a1f12" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="215" font-size="18" font-weight="700" fill="#fde68a">Сильная модель</text>
    <text x="600" y="238" font-size="14" fill="#cbd5e1">логика, цепочки атак</text>
    <path d="M400 256 H800 L900 336 H300 Z" fill="#12233a" stroke="#38bdf8" stroke-width="2"/>
    <text x="600" y="303" font-size="18" font-weight="700" fill="#bae6fd">Дешёвая / локальная модель</text>
    <text x="600" y="326" font-size="14" fill="#cbd5e1">классификация, извлечение, рутина</text>
    <path d="M300 344 H900 L1000 450 H200 Z" fill="#0d2a33" stroke="#14d3b4" stroke-width="2"/>
    <text x="600" y="395" font-size="20" font-weight="800" fill="#99f6e4">Код и инструменты</text>
    <text x="600" y="422" font-size="15" fill="#cbd5e1">разведка, сканы, дедупликация, сравнение, оценка — бесплатно</text>
  </g>
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="16">
    <text x="1010" y="125" fill="#f43f5e">$$$$</text><text x="1010" y="215" fill="#f59e0b">$$$</text>
    <text x="1010" y="305" fill="#38bdf8">$</text><text x="1010" y="400" fill="#14d3b4">≈ 0</text>
    <text x="60" y="125" fill="#64748b">мало задач</text><text x="60" y="400" fill="#64748b">большинство задач</text>
  </g>
  <text x="600" y="495" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#94a3b8">чем ниже задача опущена по пирамиде — тем дешевле и надёжнее</text>
</svg>
