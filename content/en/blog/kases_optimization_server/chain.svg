<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Request chain and bottlenecks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1120"/><stop offset="1" stop-color="#121a2e"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14d3b4"/></marker>
  </defs>
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <g font-family="'Inter','Segoe UI',Arial,sans-serif" text-anchor="middle">
    <rect x="30" y="110" width="170" height="100" rx="14" fill="#16213a" stroke="#334155" stroke-width="2"/>
    <text x="115" y="152" font-size="19" font-weight="700" fill="#e2e8f0">Visitors</text>
    <text x="115" y="180" font-size="14" fill="#94a3b8">+ an editor clicks</text>
    <text x="115" y="198" font-size="14" fill="#94a3b8">“Save”</text>

    <rect x="260" y="110" width="190" height="100" rx="14" fill="#0d2240" stroke="#3b82f6" stroke-width="2"/>
    <text x="355" y="155" font-size="21" font-weight="800" fill="#e2e8f0">nginx</text>
    <text x="355" y="185" font-size="14" fill="#94a3b8">reverse proxy</text>

    <rect x="510" y="110" width="190" height="100" rx="14" fill="#0d2240" stroke="#3b82f6" stroke-width="2"/>
    <text x="605" y="155" font-size="21" font-weight="800" fill="#e2e8f0">Apache</text>
    <text x="605" y="185" font-size="14" fill="#94a3b8">prefork + PHP</text>

    <rect x="760" y="110" width="190" height="100" rx="14" fill="#3b1b2a" stroke="#f43f5e" stroke-width="2"/>
    <text x="855" y="155" font-size="21" font-weight="800" fill="#e2e8f0">MySQL</text>
    <text x="855" y="185" font-size="14" fill="#fda4af">the cause is here</text>

    <rect x="1010" y="110" width="160" height="100" rx="14" fill="#16213a" stroke="#334155" stroke-width="2"/>
    <text x="1090" y="152" font-size="18" font-weight="700" fill="#e2e8f0">Posts</text>
    <text x="1090" y="178" font-size="18" font-weight="700" fill="#e2e8f0">table</text>

    
    <g font-size="14">
      <rect x="250" y="250" width="210" height="96" rx="12" fill="#2a1f12"/>
      <text x="355" y="278" fill="#fde68a" font-weight="700">symptom</text>
      <text x="355" y="302" fill="#cbd5e1">worker_connections</text>
      <text x="355" y="322" fill="#cbd5e1">are not enough · 504</text>
      <rect x="500" y="250" width="210" height="96" rx="12" fill="#2a1f12"/>
      <text x="605" y="278" fill="#fde68a" font-weight="700">symptom</text>
      <text x="605" y="302" fill="#cbd5e1">150+ processes</text>
      <text x="605" y="322" fill="#cbd5e1">hit the limit</text>
      <rect x="750" y="250" width="210" height="96" rx="12" fill="#3b1b2a"/>
      <text x="855" y="278" fill="#fda4af" font-weight="700">cause</text>
      <text x="855" y="302" fill="#cbd5e1">Waiting for</text>
      <text x="855" y="322" fill="#cbd5e1">table level lock</text>
      <rect x="1000" y="250" width="180" height="96" rx="12" fill="#16213a"/>
      <text x="1090" y="290" fill="#cbd5e1">a write locks</text>
      <text x="1090" y="312" fill="#cbd5e1">the whole table</text>
    </g>
  </g>
  <g stroke="#14d3b4" stroke-width="3" marker-end="url(#a)"><path d="M200 160 H 254"/><path d="M450 160 H 504"/><path d="M700 160 H 754"/><path d="M950 160 H 1004"/></g>
  <text x="600" y="60" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="17" fill="#94a3b8">every level shows a symptom — the cause is at the end</text>
</svg>
