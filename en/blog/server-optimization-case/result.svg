<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MySQL metrics before and after tuning">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1120"/><stop offset="1" stop-color="#121a2e"/></linearGradient></defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <g font-family="'Inter','Segoe UI',Arial,sans-serif">
    <text x="40" y="58" font-size="24" font-weight="800" fill="#e2e8f0">pt-query-digest: before and after</text>
    <g font-size="15"><rect x="470" y="40" width="16" height="16" rx="3" fill="#f43f5e"/><text x="494" y="54" fill="#cbd5e1">before</text><rect x="550" y="40" width="16" height="16" rx="3" fill="#14d3b4"/><text x="574" y="54" fill="#cbd5e1">after</text></g>
    <text x="1160" y="54" text-anchor="end" font-size="13" fill="#64748b">bar lengths are illustrative — the gap is thousands of times</text>

    
    <text x="40" y="118" font-size="17" font-weight="700" fill="#e2e8f0">Average query time</text>
    <rect x="340" y="98" width="700" height="26" rx="6" fill="#f43f5e"/><text x="1052" y="118" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#fda4af">82 s</text>
    <rect x="340" y="130" width="250" height="26" rx="6" fill="#14d3b4"/><text x="602" y="150" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#99f6e4">13 ms</text>

    <!-- 2: lock 55 s → 2 us -->
    <text x="40" y="218" font-size="17" font-weight="700" fill="#e2e8f0">Lock wait</text>
    <rect x="340" y="198" width="680" height="26" rx="6" fill="#f43f5e"/><text x="1032" y="218" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#fda4af">55 s</text>
    <rect x="340" y="230" width="30" height="26" rx="6" fill="#14d3b4"/><text x="382" y="250" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#99f6e4">2 µs</text>

    <!-- 3: concurrency 89x → 0.01x -->
    <text x="40" y="318" font-size="17" font-weight="700" fill="#e2e8f0">Concurrency</text>
    <text x="40" y="340" font-size="13" fill="#94a3b8">queries waiting at once</text>
    <rect x="340" y="298" width="520" height="26" rx="6" fill="#f43f5e"/><text x="872" y="318" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#fda4af">89x</text>
    <rect x="340" y="330" width="40" height="26" rx="6" fill="#14d3b4"/><text x="392" y="350" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#99f6e4">0,01x</text>
  </g>
  <text x="600" y="400" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#64748b">the site no longer crashes when a post is saved</text>
</svg>
