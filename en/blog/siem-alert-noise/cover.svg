<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SIEM noise: a funnel from millions of alerts to a few incidents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101f"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#64748b"/>
      <stop offset="1" stop-color="#14d3b4"/>
    </linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0d2a33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1c2a47" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  
  <g fill="#475569" opacity="0.85">
    <circle cx="90" cy="170" r="5"/><circle cx="130" cy="210" r="4"/><circle cx="70" cy="250" r="6"/><circle cx="150" cy="150" r="3"/>
    <circle cx="110" cy="300" r="5"/><circle cx="170" cy="260" r="4"/><circle cx="60" cy="340" r="4"/><circle cx="140" cy="360" r="6"/>
    <circle cx="200" cy="320" r="3"/><circle cx="90" cy="410" r="5"/><circle cx="160" cy="440" r="4"/><circle cx="210" cy="190" r="5"/>
    <circle cx="230" cy="400" r="4"/><circle cx="70" cy="470" r="3"/><circle cx="190" cy="490" r="5"/><circle cx="250" cy="260" r="4"/>
    <circle cx="120" cy="520" r="4"/><circle cx="240" cy="140" r="3"/><circle cx="270" cy="350" r="5"/><circle cx="50" cy="200" r="3"/>
  </g>
  <g fill="#f59e0b"><circle cx="180" cy="230" r="5"/><circle cx="110" cy="380" r="5"/></g>
  <g fill="#f43f5e"><circle cx="220" cy="460" r="6"/></g>

  
  <path d="M300 120 L 760 250 L 760 380 L 300 510 Z" fill="url(#funnel)" stroke="url(#accent)" stroke-width="3"/>
  <g stroke="#2a3b60" stroke-width="2" stroke-dasharray="6 8">
    <path d="M420 154 V 476"/><path d="M540 188 V 442"/><path d="M660 222 V 408"/>
  </g>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="18" fill="#94a3b8" text-anchor="middle">
    <text x="360" y="320">collection</text>
    <text x="480" y="320">suppression</text>
    <text x="600" y="320">correlation</text>
    <text x="710" y="320">cases</text>
  </g>

  
  <path d="M760 315 H 850" stroke="#14d3b4" stroke-width="4" stroke-linecap="round"/>
  <path d="M838 303 l14 12 -14 12" stroke="#14d3b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(880 230)">
    <rect width="230" height="56" rx="12" fill="#0d2a33" stroke="#14d3b4" stroke-width="2"/>
    <rect y="68" width="230" height="56" rx="12" fill="#0d2a33" stroke="#14d3b4" stroke-width="2"/>
    <rect y="136" width="230" height="56" rx="12" fill="#2a1520" stroke="#f43f5e" stroke-width="2"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="18">
      <text x="20" y="34" fill="#cbd5e1">case #1  brute</text>
      <text x="20" y="102" fill="#cbd5e1">case #2  webshell</text>
      <text x="20" y="170" fill="#fda4af">case #3  rootkit?</text>
    </g>
  </g>

  <text x="1130" y="80" text-anchor="end" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#e2e8f0">Noise in <tspan fill="#14d3b4">SIEM</tspan></text>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="24">
    <text x="60" y="580" fill="#94a3b8">millions of alerts/day</text>
    <text x="1130" y="580" text-anchor="end" fill="#14d3b4">→ cases/week</text>
  </g>
</svg>
